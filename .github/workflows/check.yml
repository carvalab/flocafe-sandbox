name: check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The runner already has Node, git and build tools, so the check runs on
      # it directly. The image is what the notebook worker runs, not CI.
      - name: Build FloCafe and check it serves
        run: |
          set -e
          sudo install -d -o "$USER" /opt/flocafe-sandbox /work
          cp bin/* /opt/flocafe-sandbox/
          chmod +x /opt/flocafe-sandbox/*.sh
          export PATH="/opt/flocafe-sandbox:$PATH"
          check() {
            pkill -f "node (scripts|tests)/" || true
            build-flocafe.sh "$1"
            setsid start-flocafe.sh >/dev/null 2>&1 < /dev/null &
            code=""
            for i in $(seq 1 90); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3101/ || true)
              [ "$code" = "200" ] && { echo "$1 served"; return 0; }
              sleep 1
            done
            echo "$1 answered $code" >&2
            tail -20 /tmp/demo-server.log >&2 || true
            return 1
          }
          check 3.13.0
          check main
